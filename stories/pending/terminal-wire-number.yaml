# SPDX-License-Identifier: GPL-2.0-or-later
# Test video for PR #1748 (issue #1585): a terminal symbol shows the number
# of the wire on it with %{conductor_text}, and follows when it changes.
# The fixture terminal-wire-number.qet beside this file has two terminal
# symbols joined by wire "101"; each carries a text "%{conductor_text}".
title: Wire numbers on terminals
summary: A terminal shows the number of the wire connected to it, and follows when it changes.
pr: 1748
fixture: terminal-wire-number.qet
thumbnail: {before: 2}

setup:
  - frame: {rect: [200, 120, 220, 250], fill: 0.85}

steps:
  - title: Wire numbers on terminals
    sub: Show the wire number next to the screw
    hold: 4

  - chapter: "Two terminals joined by wire 101"
  - hold: 3
  - caption: "Each terminal has a text: %{conductor_text}"
  - hold: 4

  - chapter: "Select the wire and change its number"
  - click: [300, 225]
  - hold: 1.5
  - key: ctrl+e
  - wait_for: {dialog: Edit conductor properties}
  - highlight: {widget: {name: m_text_le}}
    secs: 2
  - click: {widget: {name: m_text_le}}
  - press: ctrl+a
  - type: "A-205"
  - hold: 1
  - click: {widget: {class: QPushButton, text: "&OK"}}
  - wait_for: {dialog_closed: Edit conductor properties}

  - chapter: "Both terminals follow the new number"
  - highlight: {rect: [300, 128, 60, 20]}
    secs: 2
  - highlight: {rect: [300, 288, 60, 20]}
    secs: 2
  - caption: "Nothing is retyped: the terminals read the wire when they are drawn"
  - hold: 4
  - end_caption:

  - title: Wire numbers on terminals
    sub: "%{conductor_text} in a terminal's text"
    hold: 3

expect:
  - saved_text: 'A-205'
